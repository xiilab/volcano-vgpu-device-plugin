# HAMi Vulkan implicit layer manifest 를 host 노드의
# /usr/local/vgpu/vulkan/implicit_layer.d/hami.json 으로 배치하는 DaemonSet.
#
# 일반적으로 device-plugin DaemonSet 의 postStart hook 이 image 안의
# /k8s-vgpu/lib/nvidia/. 를 host 의 /usr/local/vgpu/ 로 복사하므로 이 파일은
# **fallback / 별도 환경용**. 다음 시나리오에서 유용:
#   - device-plugin 갱신 전 manifest 만 먼저 host 에 배치하고 싶을 때
#   - device-plugin image 와 별도 distribution mechanism 사용 시
#   - postStart 의 cp 명령이 비활성화된 환경
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hami-vulkan-manifest
  namespace: kube-system
data:
  hami.json: |
    {
        "file_format_version": "1.0.0",
        "layer": {
            "name": "VK_LAYER_HAMI_vgpu",
            "type": "GLOBAL",
            "library_path": "/usr/local/vgpu/libvgpu.so",
            "api_version": "1.3.0",
            "implementation_version": "1",
            "description": "HAMi Vulkan vGPU memory partitioning layer",
            "enable_environment": {
                "HAMI_VULKAN_ENABLE": "1"
            }
        }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hami-vulkan-manifest-installer
  namespace: kube-system
  labels:
    app: hami-vulkan-manifest-installer
spec:
  selector:
    matchLabels:
      app: hami-vulkan-manifest-installer
  template:
    metadata:
      labels:
        app: hami-vulkan-manifest-installer
    spec:
      tolerations:
      - operator: Exists
      nodeSelector:
        nvidia.com/gpu.present: "true"
      hostPID: false
      restartPolicy: Always
      containers:
      - name: installer
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          mkdir -p /host/usr/local/vgpu/vulkan/implicit_layer.d
          cp -f /manifest/hami.json \
                /host/usr/local/vgpu/vulkan/implicit_layer.d/hami.json
          echo "[hami-vulkan-manifest] installed at /usr/local/vgpu/vulkan/implicit_layer.d/hami.json"
          # DaemonSet 이라 종료하지 않고 sleep — restart 루프 회피
          sleep infinity
        volumeMounts:
        - name: manifest
          mountPath: /manifest
          readOnly: true
        - name: host-vgpu
          mountPath: /host/usr/local/vgpu
        securityContext:
          runAsUser: 0
      volumes:
      - name: manifest
        configMap:
          name: hami-vulkan-manifest
      - name: host-vgpu
        hostPath:
          path: /usr/local/vgpu
          type: DirectoryOrCreate
